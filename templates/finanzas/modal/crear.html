<!-- Modal Registrar Gasto / Movimiento Financiero -->
<div class="modal-overlay" id="modalCrearMovimiento">
    <div class="modal-container">
        <div class="modal-header">
            <h3 class="modal-title">Registrar Movimiento Financiero</h3>
            <button class="modal-close" onclick="closeModal('modalCrearMovimiento')">&times;</button>
        </div>
        <form method="POST" action="{% url 'finanzas:crear' %}">
            {% csrf_token %}
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Cliente *</label>
                    <select name="cliente_id" class="form-control" required>
                        <option value="">-- Seleccione Cliente --</option>
                        {% for c in clientes %}
                            <option value="{{ c.id }}">{{ c.nombre_razon_social }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Tipo de Movimiento Financiero *</label>
                    <select name="tipo" class="form-control" required>
                        <option value="GASTO_PROPIO">Gasto Propio (Pagado por mí / Pendiente Reembolso)</option>
                        <option value="GASTO_FONDO_CLIENTE">Gasto Realizado con Fondo del Cliente</option>
                        <option value="FONDO_RECIBIDO">Fondo Recibido del Cliente (Adelanto/Provisión)</option>
                        <option value="REEMBOLSO_RECIBIDO">Reembolso Recibido</option>
                        <option value="DEVOLUCION_SALDO">Devolución de Saldo Sobrante al Cliente</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Concepto / Detalle del Gasto *</label>
                        <input type="text" name="concepto" class="form-control" required placeholder="Ej: Pago de timbres notariales, transporte, aranceles">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Monto (Bs) *</label>
                        <input type="number" step="0.01" name="monto" class="form-control" required placeholder="Ej: 150.00">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Fecha de Ejecución *</label>
                        <input type="date" name="fecha" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Método de Pago</label>
                        <select name="metodo_pago" class="form-control">
                            <option value="EFECTIVO">Efectivo</option>
                            <option value="TRANSFERENCIA">Transferencia Bancaria</option>
                            <option value="QR">Pago QR</option>
                            <option value="TARJETA">Tarjeta</option>
                            <option value="OTRO">Otro</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Proceso / Asunto Relacionado (Opcional)</label>
                    <select name="proceso_id" class="form-control">
                        <option value="">-- General / No aplica a proceso específico --</option>
                        {% for p in procesos %}
                            <option value="{{ p.id }}">{{ p.cliente.nombre_razon_social }} - {{ p.titulo }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Observaciones</label>
                    <textarea name="observaciones" class="form-control" rows="2" placeholder="Notas sobre el pago o factura..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('modalCrearMovimiento')">Cancelar</button>
                <button type="submit" class="btn btn-primary">Registrar Movimiento</button>
            </div>
        </form>
    </div>
</div>
