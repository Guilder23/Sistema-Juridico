<!-- Modal Eliminar Usuario -->
<div class="modal-overlay" id="modalEliminarUsuario">
    <div class="modal-container" style="max-width: 440px;">
        <div class="modal-header">
            <h3 class="modal-title" style="color: var(--danger);">Eliminar Cuenta</h3>
            <button class="modal-close" onclick="closeModal('modalEliminarUsuario')">&times;</button>
        </div>
        <form method="POST" id="formEliminarUsuario" action="">
            {% csrf_token %}
            <div class="modal-body">
                <p>¿Estás seguro de que deseas eliminar permanentemente al usuario <strong id="delete_username_label" style="color: #fff;"></strong>?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('modalEliminarUsuario')">Cancelar</button>
                <button type="submit" class="btn btn-danger">Eliminar Usuario</button>
            </div>
        </form>
    </div>
</div>
