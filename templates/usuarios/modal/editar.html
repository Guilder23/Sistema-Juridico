<!-- Modal Editar Usuario -->
<div class="modal-overlay" id="modalEditarUsuario">
    <div class="modal-container">
        <div class="modal-header">
            <h3 class="modal-title">Editar Información de Usuario</h3>
            <button class="modal-close" onclick="closeModal('modalEditarUsuario')">&times;</button>
        </div>
        <form method="POST" id="formEditarUsuario" action="">
            {% csrf_token %}
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Nombre de Usuario</label>
                    <input type="text" id="edit_user_username" class="form-control" disabled style="opacity: 0.7;">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Nombres</label>
                        <input type="text" name="first_name" id="edit_user_first_name" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Apellidos</label>
                        <input type="text" name="last_name" id="edit_user_last_name" class="form-control">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Rol del Sistema</label>
                        <select name="rol" id="edit_user_rol" class="form-control">
                            <option value="GESTOR">Gestor</option>
                            <option value="ADMINISTRADOR">Administrador</option>
                            <option value="CONSULTA">Consulta</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Correo Electrónico</label>
                        <input type="email" name="email" id="edit_user_email" class="form-control">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Teléfono</label>
                        <input type="text" name="telefono" id="edit_user_telefono" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Cargo / Función</label>
                        <input type="text" name="cargo" id="edit_user_cargo" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Nueva Contraseña (dejar en blanco para conservar actual)</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('modalEditarUsuario')">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar Cambios</button>
            </div>
        </form>
    </div>
</div>
