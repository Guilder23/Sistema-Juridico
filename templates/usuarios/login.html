{% load static socialaccount %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - LexDocs IA</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #F8FAFC;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            background: #FFFFFF;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <div style="width: 52px; height: 52px; border-radius: 12px; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem auto; border: 1px solid #C7D2FE;">
                <i data-lucide="scale" style="width: 28px; height: 28px;"></i>
            </div>
            <h1 style="font-size: 1.6rem; font-weight: 800; color: var(--text-primary);">LexDocs IA</h1>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem;">Gestión Documental, Clientes & Asistente IA</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="badge badge-danger" style="display: block; text-align: center; margin-bottom: 1.25rem; padding: 0.75rem; border-radius: 8px;">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'usuarios:login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Nombre de Usuario</label>
                <input type="text" name="username" class="form-control" required autofocus placeholder="Usuario">
            </div>

            <div class="form-group" style="margin-bottom: 1.75rem;">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 0.85rem;">
                <i data-lucide="log-in" style="width: 16px; height: 16px;"></i>
                <span>Ingresar al Sistema</span>
            </button>
        </form>

        <div style="margin: 1.25rem 0; display: flex; align-items: center; gap: 0.75rem; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em;">
            <span style="flex: 1; height: 1px; background: var(--border-color);"></span>
            <span>o continúa con</span>
            <span style="flex: 1; height: 1px; background: var(--border-color);"></span>
        </div>

        <a href="{% provider_login_url 'google' %}" class="btn btn-secondary" style="width: 100%; justify-content: center; padding: 0.85rem; background: #fff; color: var(--text-primary); border: 1px solid var(--border-color);">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" style="margin-right: 0.5rem;">
                <path fill="#EA4335" d="M12 10.2v3.9h5.4c-.2 1.3-1.5 3.9-5.4 3.9-3.2 0-5.8-2.6-5.8-5.9s2.6-5.9 5.8-5.9c1.8 0 3.1.8 3.8 1.4l2.6-2.5C16.9 3.9 14.8 3 12 3c-5 0-9 4-9 9s4 9 9 9c5.2 0 8.7-3.7 8.7-8.9 0-.6-.1-1.1-.2-1.6H12z"/>
                <path fill="#34A853" d="M3.5 7.4l3.4 2.5c.9-1.7 2.9-2.9 5.1-2.9 1.8 0 3.1.8 3.8 1.4l2.6-2.5C16.9 3.9 14.8 3 12 3c-3.2 0-6 1.8-8.5 4.4z"/>
                <path fill="#FBBC05" d="M3.5 16.6c1.2 2.3 3.6 3.9 8.5 3.9 2.5 0 4.6-.8 6.1-2.3l-2.9-2.4c-.8.5-1.9.9-3.2.9-2.2 0-4.1-1.5-4.7-3.5l-3.8 2.4z"/>
                <path fill="#4285F4" d="M12 6.3c1.7 0 3.1.6 4.3 1.8l3.2-3.1C17.1 2.9 14.9 2 12 2c-5 0-9 4-9 9 0 1.5.4 2.9 1.1 4.1l3.5-2.7c-.1-.5-.2-1-.2-1.5 0-3.1 2.6-5.6 5.6-5.6z"/>
            </svg>
            <span>Continuar con Google</span>
        </a>

        <div style="text-align: center; margin-top: 1.75rem; font-size: 0.8rem; color: var(--text-muted);">
            Usuario por defecto: <strong style="color: var(--text-primary);">admin</strong> / <strong style="color: var(--text-primary);">admin123</strong>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
