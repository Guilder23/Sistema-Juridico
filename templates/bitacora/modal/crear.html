<!-- Modal Crear Entrada Bitácora -->
<div class="modal-overlay" id="modalCrearBitacora">
    <div class="modal-container">
        <div class="modal-header">
            <h3 class="modal-title">Registrar Evento / Bitácora</h3>
            <button class="modal-close" onclick="closeModal('modalCrearBitacora')">&times;</button>
        </div>
        <form method="POST" action="{% url 'bitacora:crear' %}">
            {% csrf_token %}
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Cliente *</label>
                    <select name="cliente_id" class="form-control" required>
                        <option value="">-- Seleccione Cliente --</option>
                        {% for c in clientes %}
                            <option value="{{ c.id }}">{{ c.nombre_razon_social }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Proceso / Asunto Relacionado (Opcional)</label>
                    <select name="proceso_id" class="form-control">
                        <option value="">-- General --</option>
                        {% for p in procesos %}
                            <option value="{{ p.id }}">{{ p.cliente.nombre_razon_social }} - {{ p.titulo }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Tipo de Actividad</label>
                        <select name="tipo" class="form-control">
                            <option value="DOCUMENTO_RECIBIDO">Documentación Recibida</option>
                            <option value="SOLICITUD_PRESENTADA">Solicitud Presentada</option>
                            <option value="PAGO_REALIZADO">Pago / Gasto Realizado</option>
                            <option value="RESPUESTA_RECIBIDA">Respuesta Recibida</option>
                            <option value="DOCUMENTO_SOLICITADO">Documentación Solicitada al Cliente</option>
                            <option value="REUNION">Reunión / Llamada</option>
                            <option value="CAMBIO_ESTADO">Cambio de Estado</option>
                            <option value="OTRO">Otra Actividad</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Fecha del Suceso *</label>
                        <input type="date" name="fecha_actividad" class="form-control" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Título o Resumen Breve *</label>
                    <input type="text" name="titulo" class="form-control" required placeholder="Ej: Se presentó memorial ante la alcaldía">
                </div>

                <div class="form-group">
                    <label class="form-label">Descripción Detallada *</label>
                    <textarea name="descripcion" class="form-control" rows="3" required placeholder="Detalla qué ocurrió, quién atendió, número de hoja de ruta, etc."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('modalCrearBitacora')">Cancelar</button>
                <button type="submit" class="btn btn-primary">Registrar en Bitácora</button>
            </div>
        </form>
    </div>
</div>
