<!-- Modal de Filtro o Configuración Rápida del Dashboard -->
<div class="modal-overlay" id="modalFiltroDashboard">
    <div class="modal-container">
        <div class="modal-header">
            <h3 class="modal-title">Filtrar Dashboard por Período</h3>
            <button class="modal-close" onclick="closeModal('modalFiltroDashboard')">&times;</button>
        </div>
        <form method="GET" action="{% url 'dashboard:index' %}">
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Desde</label>
                    <input type="date" name="fecha_desde" class="form-control">
                </div>
                <div class="form-group">
                    <label class="form-label">Hasta</label>
                    <input type="date" name="fecha_hasta" class="form-control">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('modalFiltroDashboard')">Cancelar</button>
                <button type="submit" class="btn btn-primary">Aplicar Filtro</button>
            </div>
        </form>
    </div>
</div>
