<!-- Modal Crear Proceso -->
<div class="modal-overlay" id="modalCrearProceso">
    <div class="modal-container">
        <div class="modal-header">
            <h3 class="modal-title">Crear Nuevo Proceso / Asunto</h3>
            <button class="modal-close" onclick="closeModal('modalCrearProceso')">&times;</button>
        </div>
        <form method="POST" action="{% url 'procesos:crear' %}">
            {% csrf_token %}
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Cliente Asociado *</label>
                    <select name="cliente_id" class="form-control" required>
                        <option value="">-- Seleccione Cliente --</option>
                        {% for c in clientes %}
                            <option value="{{ c.id }}">{{ c.nombre_razon_social }} ({{ c.ci_nit }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Título del Proceso / Asunto *</label>
                    <input type="text" name="titulo" class="form-control" required placeholder="Ej: Trámite de Licencia de Funcionamiento">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Estado Inicial</label>
                        <select name="estado" class="form-control">
                            <option value="EN_PROCESO">En Proceso</option>
                            <option value="PENDIENTE">Pendiente</option>
                            <option value="ESPERANDO_DOCUMENTACION">Esperando Documentación</option>
                            <option value="ESPERANDO_CLIENTE">Esperando Cliente</option>
                            <option value="FINALIZADO">Finalizado</option>
                            <option value="CANCELADO">Cancelado</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Prioridad</label>
                        <select name="prioridad" class="form-control">
                            <option value="MEDIA">Media</option>
                            <option value="BAJA">Baja</option>
                            <option value="ALTA">Alta</option>
                            <option value="URGENTE">Urgente</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Responsable Asignado</label>
                        <select name="responsable_id" class="form-control">
                            <option value="">-- Sin asignar --</option>
                            {% for u in usuarios %}
                                <option value="{{ u.id }}">{{ u.get_full_name|default:u.username }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Fecha Límite</label>
                        <input type="date" name="fecha_limite" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Descripción</label>
                    <textarea name="descripcion" class="form-control" rows="3" placeholder="Detalle de etapas o alcance..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('modalCrearProceso')">Cancelar</button>
                <button type="submit" class="btn btn-primary">Registrar Asunto</button>
            </div>
        </form>
    </div>
</div>
