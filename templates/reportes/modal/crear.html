<!-- Modal Generar Informe -->
<div class="modal-overlay" id="modalGenerarReporte">
    <div class="modal-container">
        <div class="modal-header">
            <h3 class="modal-title">Generar Informe de Gestión</h3>
            <button class="modal-close" onclick="closeModal('modalGenerarReporte')">&times;</button>
        </div>
        <form method="POST" action="{% url 'reportes:generar' %}">
            {% csrf_token %}
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Cliente *</label>
                    <select name="cliente_id" class="form-control" required>
                        <option value="">-- Seleccione Cliente --</option>
                        {% for c in clientes %}
                            <option value="{{ c.id }}">{{ c.nombre_razon_social }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Título del Informe *</label>
                    <input type="text" name="titulo" class="form-control" required placeholder="Ej: Informe Trimestral de Procesos y Gastos">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Tipo de Informe</label>
                        <select name="tipo" class="form-control">
                            <option value="INFORME_GESTION">Informe de Gestión General</option>
                            <option value="INFORME_FINANCIERO">Estado de Cuenta / Gastos</option>
                            <option value="INFORME_PROCESOS">Resumen de Procesos y Asuntos</option>
                            <option value="INFORME_IA">Informe Especial Asistido por IA</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Asunto / Proceso (Opcional)</label>
                        <select name="proceso_id" class="form-control">
                            <option value="">-- Todos los asuntos del cliente --</option>
                            {% for p in procesos %}
                                <option value="{{ p.id }}">{{ p.cliente.nombre_razon_social }} - {{ p.titulo }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Período Desde</label>
                        <input type="date" name="periodo_inicio" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Período Hasta</label>
                        <input type="date" name="periodo_fin" class="form-control">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('modalGenerarReporte')">Cancelar</button>
                <button type="submit" class="btn btn-primary">Compilar y Generar</button>
            </div>
        </form>
    </div>
</div>
