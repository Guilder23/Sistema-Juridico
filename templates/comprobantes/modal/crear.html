<!-- Modal Subir Comprobante / Foto -->
<div class="modal-overlay" id="modalSubirComprobante">
    <div class="modal-container">
        <div class="modal-header">
            <h3 class="modal-title">Subir Fotografía / Factura / Recibo</h3>
            <button class="modal-close" onclick="closeModal('modalSubirComprobante')">&times;</button>
        </div>
        <form method="POST" action="{% url 'comprobantes:subir' %}" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Cliente *</label>
                    <select name="cliente_id" class="form-control" required>
                        <option value="">-- Seleccione Cliente --</option>
                        {% for c in clientes %}
                            <option value="{{ c.id }}">{{ c.nombre_razon_social }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Tipo de Comprobante</label>
                        <select name="tipo" class="form-control">
                            <option value="FACTURA">Factura</option>
                            <option value="RECIBO">Recibo</option>
                            <option value="TICKET">Ticket / Vale</option>
                            <option value="BOLETA_DEPOSITO">Boleta Depósito</option>
                            <option value="COMPROBANTE_TRANSFERENCIA">Transferencia / QR</option>
                            <option value="OTRO">Otro</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Número de Comprobante</label>
                        <input type="text" name="numero_comprobante" class="form-control" placeholder="Ej: 004812">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Proveedor / Emisor</label>
                        <input type="text" name="proveedor_emisor" class="form-control" placeholder="Ej: Notaría de Fe Pública #12">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Monto (Bs) *</label>
                        <input type="number" step="0.01" name="monto" class="form-control" required placeholder="Ej: 80.00">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Fecha de Emisión</label>
                        <input type="date" name="fecha_emision" class="form-control">
                    </div>
                    <div class="form-group">
                        <label class="form-label">NIT / CI Emisor</label>
                        <input type="text" name="nit_emisor" class="form-control">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Fotografía o Imagen del Comprobante *</label>
                    <input type="file" name="imagen" accept="image/*,.pdf" class="form-control" required>
                </div>

                <div class="form-group" style="margin-top: 1rem; background: rgba(99, 102, 241, 0.08); padding: 0.85rem; border-radius: 6px;">
                    <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.85rem;">
                        <input type="checkbox" name="registrar_gasto" checked>
                        <span>Crear automáticamente un registro de Gasto asociado en Finanzas</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeModal('modalSubirComprobante')">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar Comprobante</button>
            </div>
        </form>
    </div>
</div>
